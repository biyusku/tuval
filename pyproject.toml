[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "tuval"
version = "0.1.0.dev0"
description = "Run your own, legitimately licensed Windows creative apps on Linux — safely, honestly, reproducibly."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "tuval contributors" }]
keywords = ["wine", "linux", "creative-cloud", "compatibility"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/biyusku/tuval"
Issues = "https://github.com/biyusku/tuval/issues"

[project.scripts]
tuval = "tuval.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tuval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]
warn_unreachable = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PL", "PTH", "S", "T20", "ERA"]
ignore = [
    "PLR0913", # argparse/dataclass constructors legitimately take many args
    "S603",    # subprocess without shell=True is the safe form; we never pass shell=True
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004"]
